<!DOCTYPE html>
<html lang="de" data-application="academy">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resqly Academy — EKG und Sonographie interaktiv lernen</title>
<meta name="description" content="Resqly Academy: interaktive Kurse für EKG und Sonographie — kurze Lektionen, Übungen und Wissensfragen, direkt im Browser.">
<meta name="theme-color" content="#eef3fa">
<script src="assets/js/platform.js"></script>
<script>
// This file used to be the course itself. Course domains and old ?app= links
// are forwarded to their folder before anything is drawn; the hash is kept.
const resqlyAssetRoot = location.protocol === "file:" ? "./" : "/";
const resqlyLegacy = window.Resqly && Resqly.legacyURL(location);
if (resqlyLegacy) {
  document.documentElement.style.display = "none";
  location.replace(resqlyLegacy);
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=30">
<link rel="stylesheet" href="assets/css/academy.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2314243f'/%3E%3Cpath d='M12 42L50 24l38 18-38 18zM28 52v16q22 14 44 0V52' fill='none' stroke='white' stroke-width='7' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 9.5L12 5l10 4.5-10 4.5zM6.5 12v4.5q5.5 3.5 11 0V12"/>
        </svg>
      </span>
      <span>Resqly Academy</span>
    </a>
  </div>
</header>

<main>
  <div class="app" id="app"></div>
</main>

<noscript>Bitte JavaScript aktivieren, um die Kursübersicht zu sehen.</noscript>
<script>
if (!window.Resqly) document.getElementById("app").textContent = "Die Seite konnte nicht geladen werden. Bitte neu laden.";
else if (!resqlyLegacy) {
  const bootstrapScript = document.createElement("script");
  bootstrapScript.src = resqlyAssetRoot + "assets/js/bootstrap.js";
  document.body.append(bootstrapScript);
}
</script>
</body>
</html>
