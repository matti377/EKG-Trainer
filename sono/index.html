<!DOCTYPE html>
<html lang="de" data-application="sono">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SONO by Resqly — Sonographie verstehen</title>
<meta name="description" content="Sonographie lernen: sechs Module mit kurzen Lektionen, Originalclips und Übungen.">
<meta name="theme-color" content="#e2f7f5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script>
// Root-relative over HTTP so deep links like /sono/lektion/lunge-06 still find the assets.
const resqlyAssetRoot = location.protocol === "file:" ? "../" : "/";
for (const file of ["style.css?v=30", "sono.css"]) {
  const sheet = document.createElement("link");
  sheet.rel = "stylesheet"; sheet.href = resqlyAssetRoot + "assets/css/" + file;
  document.head.append(sheet);
}
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230a8d83'/%3E%3Cpath d='M20 25Q50 10 80 25L65 80Q50 90 35 80Z' fill='none' stroke='white' stroke-width='7'/%3E%3C/svg%3E">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 4h8v5H8zM8 9L3 19q9 5 18 0L16 9M6 15q6 4 12 0"/>
        </svg>
      </span>
      <span>SONO by Resqly</span>
    </a>
    <div id="top-stats" style="display:flex;align-items:center;gap:8px"></div>
  </div>
</header>

<main>
  <div class="app" id="app"></div>
</main>

<nav class="nav" id="nav" aria-label="Hauptnavigation"></nav>

<noscript>Bitte JavaScript aktivieren, um den interaktiven Kurs zu verwenden.</noscript>
<script>
const platformScript = document.createElement("script");
platformScript.src = resqlyAssetRoot + "assets/js/platform.js";
platformScript.onload = function () {
  const bootstrapScript = document.createElement("script");
  bootstrapScript.src = resqlyAssetRoot + "assets/js/bootstrap.js";
  document.body.append(bootstrapScript);
};
platformScript.onerror = function () { document.getElementById("app").textContent = "Die Anwendung konnte nicht geladen werden. Bitte neu laden."; };
document.body.append(platformScript);
</script>
</body>
</html>
